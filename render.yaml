# Render blueprint for the backend (New -> Blueprint in the Render dashboard).
# Secrets are declared with sync: false, so their values are entered in the dashboard and never stored in git.
services:
  - type: web
    name: job-agent-hub-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - api/**
    envVars:
      - key: STORAGE_BACKEND
        value: supabase
      - key: COOKIE_SECURE
        value: "true"
      - key: WORKER_THREADS
        value: "1"
      - key: LLM_PROVIDER
        value: gemini
      - key: DATABASE_URL          # Supabase -> Connect -> Session pooler URI
        sync: false
      - key: SUPABASE_URL          # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY   # Supabase -> Project Settings -> API keys -> secret key
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL          # the Vercel URL, e.g. https://job-agent-hub.vercel.app
        sync: false
      - key: ALLOW_SIGNUPS         # "true" lets friends create accounts
        sync: false
